[package]
name = "rabbit_os"
version = "0.1.0"
edition = "2021"

[dependencies]
# Ovde dodajemo biblioteke koje su nam potrebne za kernel
volatile = "0.2.6"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
// Optimizujemo za brzinu (Fast Boot)
opt-level = 3
